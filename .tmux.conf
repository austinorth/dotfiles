# Configure True Colors
set-option -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Change prefix to Control+a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Pi settings
set -g extended-keys on
set -g extended-keys-format csi-u

# Window splits
unbind %
bind | split-window -h -c "#{pane_current_path}" # split horizontally and keep current path

unbind '"'
bind - split-window -v -c "#{pane_current_path}" # split vertically and keep current path

# Stop escape-key delay
set -sg escape-time 0

# Increase repeat time, so that ctrl/alt + holding
# down arrow keys can be used to resize panes reliably
set -g repeat-time 1500

# Automatically set window title
setw -g automatic-rename on
set -g allow-rename on
set -g set-titles on

# Add keybinds for easily resizing panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Add keybind for maximizing and minimizing pane
bind -r m resize-pane -Z 

# Enable the mouse
set -g mouse on

# Configure vim movements for tmux's copy mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# Status bar settings
set -g status-position bottom
set -g status-justify left

# Everforest dark (medium) palette
# bg0 #2d353b  bg3 #475258  bg_blue #384b55  fg #d3c6aa
# grey0 #7a8478  grey1 #859289  grey2 #9da9a0
# green #a7c080  aqua #83c092  blue #7fbbb3  yellow #dbbc7f
set -g status-style 'bg=#2d353b,fg=#859289'
set -g message-style 'bg=#384b55,fg=#d3c6aa'
set -g message-command-style 'bg=#384b55,fg=#dbbc7f'
set -g mode-style 'bg=#475258,fg=#dbbc7f'
set -g pane-border-style 'fg=#475258'
set -g pane-active-border-style 'fg=#a7c080'

set -g status-left '#[bg=#a7c080,fg=#2d353b,bold] #S #[default] '
set -g status-left-length 30

set -g status-right '#[fg=#7a8478]%Y-%m-%d #[fg=#d3c6aa,bold]%H:%M #[default]'
set -g status-right-length 50

# Windows turn blue while an agent (claude, pi, ...) is working in them.
# @agent_working is toggled by ~/.tmux/agent-status.sh on|off from agent hooks.
# Idle: grey text; current: raised bg3 with fg text;
# working: solid blue; done and unseen (needs review): solid green
setw -g window-status-separator ''
setw -g window-status-format '#{?@agent_working,#[bg=#7fbbb3#,fg=#2d353b],#{?@agent_done,#[bg=#a7c080#,fg=#2d353b#,bold],#[fg=#859289]}} #I #W #F #[default]'
setw -g window-status-current-format '#{?@agent_working,#[bg=#7fbbb3#,fg=#2d353b#,bold],#[bg=#475258#,fg=#d3c6aa#,bold]} #I #W #F #[default]'

# Change numbering to start at 1, instead of 0
set -g base-index 1
setw -g pane-base-index 1

# F1-F12 to switch windows 1-12
bind-key -n F1 select-window -t 1
bind-key -n F2 select-window -t 2
bind-key -n F3 select-window -t 3
bind-key -n F4 select-window -t 4
bind-key -n F5 select-window -t 5
bind-key -n F6 select-window -t 6
bind-key -n F7 select-window -t 7
bind-key -n F8 select-window -t 8
bind-key -n F9 select-window -t 9
bind-key -n F10 select-window -t 10
bind-key -n F11 select-window -t 11
bind-key -n F12 select-window -t 12

# Clear the "needs review" flag once you look at a window
set-hook -g session-window-changed 'set-option -wu @agent_done'
set-hook -g after-select-window 'set-option -wu @agent_done'
set-hook -g client-attached 'set-option -wu @agent_done'

# Plugin List
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
# set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
# set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# Plugin Configuration
# set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
# set -g @continuum-restore 'on' # enable tmux-continuum functionality

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
